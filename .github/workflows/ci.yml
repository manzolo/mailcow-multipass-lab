name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell scripts syntax
        run: |
          echo "Checking shell script syntax..."
          for script in manager.sh scripts/*.sh mailcow/*.sh tests/*.sh; do
            if [ -f "$script" ]; then
              echo "Checking $script"
              bash -n "$script"
            fi
          done
          echo "All scripts passed syntax check"

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          echo "Running ShellCheck..."
          shellcheck -x manager.sh scripts/*.sh mailcow/*.sh tests/*.sh || true
          echo "ShellCheck completed (warnings allowed)"

      - name: Validate DNS zone files
        run: |
          echo "Validating DNS zone file syntax..."
          sudo apt-get install -y bind9-utils
          for zone in dns/zones/db.*; do
            echo "Checking $zone"
            named-checkzone dummy "$zone" || echo "Warning: $zone may have issues"
          done

      - name: Check configuration files
        run: |
          echo "Checking configuration files exist..."
          test -f config/network.env && echo "✓ network.env"
          test -f config/domains.env && echo "✓ domains.env"
          test -f config/users.env && echo "✓ users.env"
          test -f dns/named.conf.options && echo "✓ named.conf.options"
          test -f dns/named.conf.local && echo "✓ named.conf.local"
          echo "All configuration files present"

  # Note: Full integration tests require a self-hosted runner with multipass
  # See .github/workflows/full-test.yml for the complete test workflow

  # Quick smoke test that can run on standard runners
  smoke-test:
    name: Smoke Test (Syntax Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test manager.sh help
        run: |
          # Test that manager.sh can at least show help
          ./manager.sh --help || ./manager.sh help || true

      - name: Test script permissions
        run: |
          echo "Checking script permissions..."
          test -x manager.sh && echo "✓ manager.sh is executable"
          for script in scripts/*.sh; do
            test -x "$script" && echo "✓ $script is executable" || echo "✗ $script needs chmod +x"
          done
