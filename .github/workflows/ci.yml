name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell scripts syntax
        run: |
          echo "Checking shell script syntax..."
          for script in manager.sh scripts/*.sh mailcow/*.sh tests/*.sh; do
            if [ -f "$script" ]; then
              echo "Checking $script"
              bash -n "$script"
            fi
          done
          echo "All scripts passed syntax check"

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          echo "Running ShellCheck..."
          shellcheck -x manager.sh scripts/*.sh mailcow/*.sh tests/*.sh || true
          echo "ShellCheck completed (warnings allowed)"

      - name: Validate DNS zone files
        run: |
          echo "Validating DNS zone file syntax..."
          sudo apt-get install -y bind9-utils
          for zone in dns/zones/db.*; do
            echo "Checking $zone"
            named-checkzone dummy "$zone" || echo "Warning: $zone may have issues"
          done

      - name: Check configuration files
        run: |
          echo "Checking configuration files exist..."
          test -f config/network.env && echo "✓ network.env"
          test -f config/domains.env && echo "✓ domains.env"
          test -f config/users.env && echo "✓ users.env"
          test -f dns/named.conf.options && echo "✓ named.conf.options"
          test -f dns/named.conf.local && echo "✓ named.conf.local"
          echo "All configuration files present"

  integration-test:
    name: Integration Test
    runs-on: [self-hosted, multipass]
    needs: lint
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Multipass
        run: |
          multipass version
          multipass list || true

      - name: Cleanup previous runs
        run: |
          echo "Cleaning up any existing VMs..."
          ./manager.sh destroy || true
          sleep 10

      - name: Check prerequisites
        run: ./scripts/00-check-prerequisites.sh

      - name: Deploy DNS Server
        run: |
          echo "Deploying DNS server..."
          ./scripts/01-deploy-dns.sh <<< "y"

      - name: Test DNS
        run: |
          echo "Testing DNS resolution..."
          sleep 10
          dig @10.4.26.10 mars.lab MX +short
          dig @10.4.26.10 venus.lab MX +short
          dig @10.4.26.10 jupiter.lab MX +short

      - name: Deploy Mars Mail Server
        run: |
          echo "Deploying Mars mail server..."
          ./scripts/02-deploy-mars.sh <<< "y"
        timeout-minutes: 20

      - name: Verify Mars
        run: |
          echo "Verifying Mars deployment..."
          multipass exec mars -- cat /var/log/mailcow-setup/status
          multipass exec mars -- docker ps --format '{{.Names}}' | head -10

      - name: Run DNS Tests
        run: ./tests/test-dns.sh || true

      - name: Run SMTP Tests
        run: ./tests/test-smtp.sh || true

      - name: Show Status
        run: ./manager.sh status

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          ./manager.sh destroy || true

  # Quick smoke test that can run on standard runners (limited)
  smoke-test:
    name: Smoke Test (Syntax Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test manager.sh help
        run: |
          # Test that manager.sh can at least show help
          ./manager.sh --help || ./manager.sh help || true

      - name: Test script permissions
        run: |
          echo "Checking script permissions..."
          test -x manager.sh && echo "✓ manager.sh is executable"
          for script in scripts/*.sh; do
            test -x "$script" && echo "✓ $script is executable" || echo "✗ $script needs chmod +x"
          done
