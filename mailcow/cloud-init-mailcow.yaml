#cloud-config

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - jq

write_files:
  - path: /root/setup-mailcow.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      DOMAIN="$1"
      IP="$2"
      DNS_SERVER="$3"

      echo "Setting up Mailcow for domain: $DOMAIN with IP: $IP"

      # Wait for network to be ready
      sleep 10

      # Install Docker
      curl -fsSL https://get.docker.com | sh
      systemctl enable docker
      systemctl start docker

      # Install Docker Compose v2
      apt-get install -y docker-compose-plugin

      # Clone Mailcow
      cd /opt
      git clone https://github.com/mailcow/mailcow-dockerized.git
      cd mailcow-dockerized

      # Generate config non-interactively
      cat > mailcow.conf << EOF
      # Mailcow configuration
      MAILCOW_HOSTNAME=mail.${DOMAIN}
      MAILCOW_TZ=UTC

      # Database
      DBNAME=mailcow
      DBUSER=mailcow
      DBPASS=$(openssl rand -hex 16)
      DBROOT=$(openssl rand -hex 16)

      # HTTP settings
      HTTP_PORT=80
      HTTP_BIND=0.0.0.0
      HTTPS_PORT=443
      HTTPS_BIND=0.0.0.0

      # Mail ports
      SMTP_PORT=25
      SMTPS_PORT=465
      SUBMISSION_PORT=587
      IMAP_PORT=143
      IMAPS_PORT=993
      POP_PORT=110
      POPS_PORT=995
      SIEVE_PORT=4190

      # Skip Let's Encrypt for local lab
      SKIP_LETS_ENCRYPT=y

      # Disable ClamAV to save RAM
      SKIP_CLAMD=y

      # API settings
      API_KEY=$(openssl rand -hex 32)
      API_KEY_READ_ONLY=$(openssl rand -hex 32)
      API_ALLOW_FROM=10.4.26.0/24,127.0.0.1

      # Compose project name
      COMPOSE_PROJECT_NAME=mailcow

      # Additional settings
      ADDITIONAL_SAN=
      ACL_ANYONE=disallow
      MAILDIR_GC_TIME=7200
      ADDITIONAL_SERVER_NAMES=
      SOGO_EXPIRE_SESSION=480
      DOVECOT_MASTER_USER=
      DOVECOT_MASTER_PASS=

      # Log settings
      LOG_LINES=9999

      # SOGo Workers
      SOGO_WORKERS=1

      # Rspamd
      RSPAMD_REPUTATION=n

      # Network settings
      IPV4_NETWORK=172.22.1
      IPV6_NETWORK=fd4d:6169:6c63:6f77::/64

      # Solr (disabled to save RAM)
      SKIP_SOLR=y

      # Docker Compose version
      DOCKER_COMPOSE_VERSION=native
      EOF

      # Generate additional required config
      ./generate_config.sh << GENEOF
      mail.${DOMAIN}
      UTC
      GENEOF

      # Ensure our settings are preserved
      sed -i "s/^SKIP_CLAMD=.*/SKIP_CLAMD=y/" mailcow.conf
      sed -i "s/^SKIP_LETS_ENCRYPT=.*/SKIP_LETS_ENCRYPT=y/" mailcow.conf
      sed -i "s/^SKIP_SOLR=.*/SKIP_SOLR=y/" mailcow.conf

      # Configure DNS
      echo "nameserver ${DNS_SERVER}" > /etc/resolv.conf
      echo "nameserver 8.8.8.8" >> /etc/resolv.conf

      # Pull and start containers
      docker compose pull
      docker compose up -d

      echo "Mailcow setup complete for $DOMAIN"
      echo "Waiting for services to start..."
      sleep 60

      echo "Mailcow is ready!"

runcmd:
  # Create log directory for setup tracking
  - mkdir -p /var/log/mailcow-setup
  - touch /var/log/mailcow-setup/status

final_message: "Mailcow VM base ready after $UPTIME seconds"
